name: Build and test
on:
  pull_request:
    branches:
      - "**"
  push:
    branches:
      - "main"
      - "release/v[0-9]**"
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Setup Golang
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "^1.25"
      - name: Display go version
        run: go version
      - name: Run unit tests
        run: make test-unit
      - uses: technote-space/get-diff-action@v6.1.2
        id: git_diff
        with:
          PATTERNS: |
            **/*.go
            go.mod
            go.sum
            **/go.mod
            **/go.sum
            **/Makefile
            Makefile
        ###################
        #### Build App ####
        ###################
      - name: Build cmd apps # to ensure everything compiles
        if: env.GIT_DIFF
        run: make build-all